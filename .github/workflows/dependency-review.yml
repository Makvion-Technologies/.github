name: Dependency review

on:
  workflow_call:

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    name: review
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Dependency review
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high

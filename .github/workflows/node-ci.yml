name: Node CI

on:
  workflow_call:
    inputs:
      node-version:
        description: "Node.js version. If empty, uses .nvmrc when present, otherwise 20."
        type: string
        required: false
        default: ""
      lint-command:
        description: "Lint command to run. Leave empty to skip."
        type: string
        required: false
        default: ""
      typecheck-command:
        description: "Typecheck command to run. Leave empty to skip."
        type: string
        required: false
        default: ""
      build-command:
        description: "Build command to run. Leave empty to skip."
        type: string
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: node-ci-${{ github.repository }}-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      # Safe dummy values only — never real secrets. Lets Next.js / Prisma
      # generate and build in CI without a live database or API keys.
      SKIP_ENV_VALIDATION: "true"
      DATABASE_URL: "postgresql://ci:ci@127.0.0.1:5432/ci?schema=public"
      NEXTAUTH_SECRET: "ci-dummy-nextauth-secret-not-a-real-key"
      NEXTAUTH_URL: "http://localhost:3000"
      CRON_SECRET: "ci-dummy-cron-secret"
      NEXT_PUBLIC_PARTYKIT_HOST: "127.0.0.1:1999"
      NEXT_PUBLIC_SITE_URL: "http://localhost:3000"
      NEXT_PUBLIC_STRIPE_LINK: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Detect package manager
        id: pkg
        run: |
          if [ -f pnpm-lock.yaml ]; then
            echo "manager=pnpm" >> "$GITHUB_OUTPUT"
            echo "install=pnpm install --frozen-lockfile" >> "$GITHUB_OUTPUT"
            echo "cache=pnpm" >> "$GITHUB_OUTPUT"
          elif [ -f yarn.lock ]; then
            echo "manager=yarn" >> "$GITHUB_OUTPUT"
            echo "install=yarn install --frozen-lockfile" >> "$GITHUB_OUTPUT"
            echo "cache=yarn" >> "$GITHUB_OUTPUT"
          elif [ -f package-lock.json ]; then
            echo "manager=npm" >> "$GITHUB_OUTPUT"
            echo "install=npm ci" >> "$GITHUB_OUTPUT"
            echo "cache=npm" >> "$GITHUB_OUTPUT"
          else
            echo "manager=npm" >> "$GITHUB_OUTPUT"
            echo "install=npm install" >> "$GITHUB_OUTPUT"
            echo "cache=npm" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve Node version
        id: node
        run: |
          if [ -n "${{ inputs.node-version }}" ]; then
            echo "version=${{ inputs.node-version }}" >> "$GITHUB_OUTPUT"
          elif [ -f .nvmrc ]; then
            echo "version=$(tr -d 'v \t\n\r' < .nvmrc)" >> "$GITHUB_OUTPUT"
          else
            echo "version=20" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up pnpm
        if: steps.pkg.outputs.manager == 'pnpm'
        uses: pnpm/action-setup@v6

      - name: Enable Yarn
        if: steps.pkg.outputs.manager == 'yarn'
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ steps.node.outputs.version }}
          cache: ${{ steps.pkg.outputs.cache }}

      - name: Install dependencies
        run: ${{ steps.pkg.outputs.install }}

      - name: Lint
        if: inputs.lint-command != ''
        run: ${{ inputs.lint-command }}

      - name: Typecheck
        if: inputs.typecheck-command != ''
        run: ${{ inputs.typecheck-command }}

      - name: Build
        if: inputs.build-command != ''
        run: ${{ inputs.build-command }}

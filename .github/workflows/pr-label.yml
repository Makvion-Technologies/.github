name: PR label

on:
  workflow_call:

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  label:
    name: label
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Label by path
        uses: actions/labeler@v5
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          sync-labels: false

  assign:
    name: assign
    runs-on: ubuntu-latest
    steps:
      - name: Assign the PR author
        uses: actions/github-script@v9
        with:
          script: |
            const assignee = context.payload.pull_request.user.login;
            if (assignee.endsWith('[bot]') || context.payload.pull_request.user.type === 'Bot') {
              core.info(`Skipping bot author ${assignee}`);
              return;
            }
            const existing = (context.payload.pull_request.assignees || []).map(a => a.login);
            if (existing.includes(assignee)) {
              core.info(`${assignee} is already assigned`);
              return;
            }
            await github.rest.issues.addAssignees({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              assignees: [assignee],
            });
